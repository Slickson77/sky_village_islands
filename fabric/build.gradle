plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        url = uri("https://jitpack.io/")
        content {
            includeGroup("com.github.Chocohead")
        }
    }

    maven {
        name = "Greenhouse Maven"
        url = uri("https://maven.greenhouseteam.dev/releases/")
    }
    maven {
        url = uri("https://mvn.devos.one/releases/") // Porting Lib
    }
    maven {
        url = uri("https://maven.jamieswhiteshirt.com/libs-release") // Reach Entity Attributes (needed by Porting Lib)
        content { includeGroup("com.jamieswhiteshirt") }
    }

}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Fabric API. This is technically optional, but you probably want it anyway.
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"

    // Lithostitched
    modImplementation("maven.modrinth:XaDC71GB:1.4.11-fabric-1.20")

    //more villagers and Cloth
    modImplementation("curse.maven:more-villagers-fabric-486080:4857288")
    modImplementation("curse.maven:cloth-config-348521:5729104")

    //Farmer's Delight Refabricated

    //modImplementation("vectorwing:FarmersDelight:1.20.1")
            //{exclude(group = "net.fabricmc")}

    //modImplementation("io.github.fabricators_of_create.Porting-Lib:config:<version>")
    //modImplementation("com.github.Chocohead:Fabric-ASM:v2.3")
    //modImplementation("curse.maven:farmers-delight-refabricated-993166:8774497")



    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')


}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
