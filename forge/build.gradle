plugins {
    id 'com.gradleup.shadow'
}

loom {
    forge {
        mixinConfig "sky_village_islands.mixins.json"
    }
}

architectury {
    platformSetupLoomIde()
    forge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    // Put repositories for dependencies here
    // ForgeGradle automatically adds the Forge maven and Maven Central for you

    // If you have mod jar dependencies in ./libs, you can declare them as a repository like so.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html#sub:flat_dir_resolver
    // flatDir {
    //     dir 'libs'
    // }
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

dependencies {
    forge "net.minecraftforge:forge:$rootProject.forge_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury-forge:$rootProject.architectury_api_version"

    //mixin extras
    implementation(include("io.github.llamalad7:mixinextras-forge:0.4.1"))

    // lithostitched (modrinth)
    modImplementation ("maven.modrinth:XaDC71GB:1.4.11-forge-1.20")

    //Cristel Lib
    modImplementation ("curse.maven:cristel-lib-856996:5869180")
    modImplementation ("curse.maven:cloth-config-348521:5729105")
    implementation("blue.endless:jankson:1.2.2")
    forgeRuntimeLibrary("blue.endless:jankson:1.2.2")

    //quark and zeta (modrinth)
    modImplementation ("maven.modrinth:qnQsVE2z:1.20.1-4.0-462")
    modImplementation ("maven.modrinth:MVARlG2f:1.20.1-1.0-31")
    //modImplementation ("maven.modrinth:EltpO5cN:0.7.35.94")

    //farmer's delight (modrinth)
    //modImplementation ("maven.modrinth:R2OftAxM:1.20.1-1.3.4")

    //waystones and balm (modrinth)
    //modImplementation ("maven.modrinth:LOpKHB2A:14.1.21+forge-1.20.1")
    //modImplementation ("maven.modrinth:MBAkmtvl:7.3.44+forge-1.20.1")

    //more villagers (forge)
    //modImplementation ("curse.maven:more-villagers-484954:4857287")

    //suplementaries
    modImplementation ("curse.maven:selene-499980:9073068")
    implementation files("jars/supplementaries-1.20-3.1.43-forge.jar")

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/mods.toml') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
